<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Projects</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <style>
        .heading {
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 600;
            font-style: normal;
        }

        .playfair {
            font-family: "Playfair Display", serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
        }

        h1.heading {
            text-align: center;
            color: #cf03fc;
            text-decoration: underline;
            margin-bottom: 20px;
        }
        
        #result {
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1 class='heading'>Assign Projects to QA</h1>
    
    <div class="form-group">
        <label for="employeeSelect" class='heading mt-4'><h5><strong>Select Quality Auditor Name</strong></h5></label>
        <select id="employeeSelect" class="form-control">
            <option value="">-- Select QA --</option>
            {% for employee in employees %}
                <option value="{{ employee.id }}">{{ employee.user.get_full_name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label for="projectSelect" class='heading'><h5><strong>Select Projects</strong></h5></label>
        <select id="projectSelect" class="form-control" multiple style="height: 200px;">
            {% for project in projects %}
                <option value="{{ project.id }}">{{ project.name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <button id="assignButton" class="btn btn-primary">Assign Projects</button>
    <div id="result"></div>

    <h2 class="mt-5 heading">Assigned Projects</h2>

    <div id="assignedProjects" class="mt-3">
        {% if assignments %}
        <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th scope="col" class="playfair">Name</th>
                <th scope="col" class="playfair">Project</th>
                <th scope="col" class="playfair">Action</th>
              </tr>
            </thead>
            <tbody>
                {% for assignment in assignments %}
                <tr>
                    <td>{{ assignment.employee.user.get_full_name }}</td> 
                    <td>{{ assignment.project.name }}</td>
                    <td>
                        <form action="{% url 'assigned_delete' assignment.id %}" method="post" class="m-0">
                            {% csrf_token %}
                            <input type='submit' class="btn btn-danger btn-sm" value='Delete'>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-muted">No assignments listed at this moment.</p>
        {% endif %}
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
$(document).ready(function() {
    // Setup global jQuery AJAX configs to securely pass CSRF token validations
    $.ajaxSetup({
        headers: { "X-CSRFToken": '{{ csrf_token|escapejs }}' }
    });

    var assignmentsByEmployee = {};
    {% for employee_id, assignment in employee_assignments.items %}
        assignmentsByEmployee["{{ employee_id|escapejs }}"] = {
            name: "{{ assignment.name|escapejs }}",
            projects: "{{ assignment.projects|join:', '|escapejs }}".split(', ').filter(Boolean)
        };
    {% endfor %}

    $('#assignButton').click(function() {
        var employeeId = $('#employeeSelect').val();
        var projectIds = $('#projectSelect').val();
        var selectedProjectNames = [];
        
        $('#projectSelect option:selected').each(function() {
            selectedProjectNames.push($(this).text());
        });

        if (!employeeId || !projectIds || projectIds.length === 0) {
            alert('Please select an employee and at least one project.');
            return;
        }

        $.ajax({
            type: 'POST',
            url: '{% url "assign_projects" %}',
            data: {
                employee_id: employeeId,
                project_ids: projectIds
            },
            success: function(response) {
                $('#result').empty();
                if (response.success) {
                    $('<div class="alert alert-success"></div>')
                        .text('Projects assigned successfully!')
                        .appendTo('#result');
                    
                    // Mutate local state dictionary before calling updates
                    if (!assignmentsByEmployee[employeeId]) {
                        assignmentsByEmployee[employeeId] = {
                            name: $('#employeeSelect option:selected').text(),
                            projects: []
                        };
                    }
                    
                    // Merge array values uniquely
                    selectedProjectNames.forEach(function(proj) {
                        if (assignmentsByEmployee[employeeId].projects.indexOf(proj) === -1) {
                            assignmentsByEmployee[employeeId].projects.push(proj);
                        }
                    });

                    updateAssignedProjects(employeeId);
                } else {
                    $('<div class="alert alert-danger"></div>')
                        .text(response.message || 'Unable to assign projects.')
                        .appendTo('#result');
                }
            },
            error: function() {
                $('#result').empty();
                $('<div class="alert alert-danger"></div>')
                    .text('Error in processing request.')
                    .appendTo('#result');
            }
        });
    });

    function updateAssignedProjects(employeeId) {
        var container = $('#assignedProjects');
        container.empty();

        var data = assignmentsByEmployee[employeeId];
        var assignedProjects = data ? data.projects : [];

        if (assignedProjects.length > 0) {
            var summary = $('<div class="card card-body bg-light mb-3"></div>');
            var p = $('<p class="m-0"></p>');
            p.append($('<strong></strong>').text((data.name || '') + ': '));
            p.append(document.createTextNode(assignedProjects.join(', ')));
            summary.append(p);
            container.append(summary);
        } else {
            container.append($('<p></p>').text('No projects assigned to this employee yet.'));
        }

        container.append(
            $('<div class="mt-2"></div>').append(
                $('<a href="{% url "assign_projects" %}" class="btn btn-info btn-sm">Refresh Table View</a>')
            )
        );
    }
});
</script>
</body>
</html>
